<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tormenta Kp Nowcast</title>
  <!-- Streamlit running in the browser (stlite + Pyodide). sync_hf.py fills in __FILES__ / __REQUIREMENTS__. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.css">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    #loading { max-width: 640px; margin: 18vh auto 0; padding: 0 16px; text-align: center; color: #52514e; }
    #loading h1 { color: #0b0b0b; font-size: 28px; margin-bottom: 8px; }
    @media (prefers-color-scheme: dark) { body { background: #0e1117; } #loading { color: #c3c2b7; } #loading h1 { color: #f0efec; } }
  </style>
</head>
<body>
  <div id="root">
    <div id="loading">
      <h1>🧲 Tormenta</h1>
      <p>Starting Python in your browser and loading the model… The first visit takes about 30–60 seconds; later
        visits are faster. Everything runs on your device, with live data fetched straight from NOAA SWPC.</p>
      <p><a href="https://tormenta.streamlit.app/">Server version (Streamlit Cloud)</a> ·
        <a href="https://huggingface.co/aliza-ayaz/tormenta">Model card</a> ·
        <a href="https://github.com/Syeda-Aliza-Ayaz/Tormenta">Code</a></p>
    </div>
  </div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js";
    const files = Object.fromEntries(__FILES__.map((path) => [path, { url: "./" + path }]));
    mount({ requirements: __REQUIREMENTS__, entrypoint: "app/streamlit_app.py", files },
          document.getElementById("root"));
  </script>
</body>
</html>
