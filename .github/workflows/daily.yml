name: Daily forecast

# Issue the 7-day forecast, save NOAA's forecasts, score past forecasts, commit forecasts/ (src/issue.py).
# GFZ updates its daily file just before midnight UTC (Last-Modified 23:48 on 2026-11-09), so 02:00 UTC finds
# yesterday's row. The 06:00 run is a backup: issuing is idempotent, so it adds nothing if 02:00 already issued.
on:
  schedule:
    - cron: "0 2 * * *"           # 07:00 PKT
    - cron: "0 6 * * *"           # 11:00 PKT, backup
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: issue and score, but commit and publish nothing"
        type: boolean
        default: false

permissions:
  contents: write                 # push forecasts/ back to the repo

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt pytest==9.2.0

      - name: Tests (forecaster, NOAA parsers, daily job)
        run: python -m pytest -q tests/test_forecast.py tests/test_noaa.py tests/test_issue.py

      - name: Issue, save NOAA, score
        id: issue
        run: python -m src.issue

      - name: Commit forecasts
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "tormenta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git commit -m "Daily forecast: origin ${{ steps.issue.outputs.origin }}, ${{ steps.issue.outputs.new_rows }} new rows"
          # the weekly retrain may have pushed meanwhile; forecasts/ never conflicts with its files
          git pull --rebase
          git push
